# Civic Wise, nginx site config for civicwise.online
# Place in /etc/nginx/sites-available/civicwise.online.conf and symlink into
# sites-enabled (the filename must end in .conf). Edit the two paths marked EDIT,
# then: sudo nginx -t && sudo systemctl reload nginx
#
# Covers the deploy-time items from the SEO and security audits:
#   - HTTP -> HTTPS 301 redirect
#   - TLS (Certbot-managed certificate paths)
#   - Security headers: HSTS, X-Content-Type-Options, X-Frame-Options,
#     Referrer-Policy, Permissions-Policy, and a Content-Security-Policy
#   - Serves the prerendered per-route HTML, then falls back to the SPA
#   - Proxies /api and the dynamic /sitemap.xml to the Node app on :4000
#   - Long-cache hashed assets, no-cache HTML

# --- HTTP: redirect everything to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name civicwise.online www.civicwise.online;

    # Allow Certbot's ACME challenge over HTTP.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://civicwise.online$request_uri; }
}

# --- HTTPS ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name civicwise.online www.civicwise.online;

    # EDIT: Certbot writes these when you run certbot --nginx -d civicwise.online -d www.civicwise.online
    ssl_certificate     /etc/letsencrypt/live/civicwise.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/civicwise.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Redirect the www host to the canonical apex.
    if ($host = www.civicwise.online) { return 301 https://civicwise.online$request_uri; }

    # EDIT: path to the built client (the Vite dist folder).
    root /var/www/civicwise/client/dist;
    index index.html;

    # --- Security headers (apply to every response) ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP: 'unsafe-inline' on script-src is required for the JSON-LD structured
    # data blocks (and must stay until the app moves to nonces/SSR). style-src
    # needs 'unsafe-inline' for Tailwind/React inline styles. Adjust img/frame/
    # connect if you add providers.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://res.cloudinary.com https://i.ytimg.com; frame-src https://www.youtube-nocookie.com https://www.youtube.com; connect-src 'self' https://api.cloudinary.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    # Dynamic sitemap (includes every published course) from the Node app.
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API.
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets: cache hard.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else: serve the prerendered per-route file, then the SPA shell.
    # try_files picks /about/index.html for /about, falling back to /index.html.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
