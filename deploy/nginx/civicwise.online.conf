# Civic Wise, nginx site config for civicwise.online
#
# Install (same pattern as the other sites on this server):
#   1. sudo nano /etc/nginx/sites-available/civicwise.online.conf  and paste this file
#   2. sudo ln -s /etc/nginx/sites-available/civicwise.online.conf /etc/nginx/sites-enabled/civicwise.online.conf
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. sudo certbot --nginx -d civicwise.online -d www.civicwise.online
#      Certbot adds the SSL lines and the HTTP to HTTPS redirect to this file
#      and keeps everything below.
#
# What this file sets up:
#   - Security headers: HSTS, X-Content-Type-Options, X-Frame-Options,
#     Referrer-Policy, Permissions-Policy, and a Content-Security-Policy
#   - Serves the prerendered per-route HTML, then falls back to the app
#   - Proxies /api and the dynamic /sitemap.xml to the Node API on :4000
#   - Long-cache hashed assets, no-cache HTML

server {
    listen 80;
    listen [::]:80;
    server_name civicwise.online www.civicwise.online;

    # www and the bare domain serve the same site; each page's canonical link
    # tells search engines civicwise.online is the main address.

    # The built site. deploy/deploy.sh copies client/dist here after every
    # successful build, so visitors never see a half-built folder.
    root /var/www/civicwise/web;
    index index.html;

    # --- Security headers (apply to every response) ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP: 'unsafe-inline' on script-src is required for the JSON-LD structured
    # data blocks (and must stay until the app moves to nonces/SSR). style-src
    # needs 'unsafe-inline' for Tailwind/React inline styles. Adjust img/frame/
    # connect if you add providers.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://res.cloudinary.com https://i.ytimg.com; media-src 'self' https://res.cloudinary.com; frame-src https://www.youtube-nocookie.com https://www.youtube.com; connect-src 'self' https://api.cloudinary.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    # Dynamic sitemap (includes every published course) from the Node app.
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API.
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets: cache hard.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else: serve the prerendered per-route file, then the SPA shell.
    # try_files picks /about/index.html for /about, falling back to /index.html.
    # nginx drops the server-level add_header lines inside any location that
    # sets its own, so the security headers are repeated here for every page.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://res.cloudinary.com https://i.ytimg.com; media-src 'self' https://res.cloudinary.com; frame-src https://www.youtube-nocookie.com https://www.youtube.com; connect-src 'self' https://api.cloudinary.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
        try_files $uri $uri/ /index.html;
    }
}
